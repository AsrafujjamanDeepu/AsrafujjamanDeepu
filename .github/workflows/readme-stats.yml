name: Update README Stats Cards

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours
  workflow_dispatch:           # Allows manual trigger
  push:
    branches:
      - main

jobs:
  update-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AsrafujjamanDeepu&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=a78bfa&text_color=ffffff&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AsrafujjamanDeepu&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=a78bfa&text_color=ffffff&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Ticket Portal pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AsrafujjamanDeepu&repo=TicketPortal&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=a78bfa&text_color=ffffff
          path: profile/pin-ticketportal.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate ActiveArch pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AsrafujjamanDeepu&repo=ActiveArch&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=a78bfa&text_color=ffffff
          path: profile/pin-activearch.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Assignment Submission System pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AsrafujjamanDeepu&repo=AssignmentSubmissionSystem&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=a78bfa&text_color=ffffff
          path: profile/pin-assignmentsubmissionsystem.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Study Tracker pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AsrafujjamanDeepu&repo=Study_Tracker_Python&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=a78bfa&text_color=ffffff
          path: profile/pin-study-tracker.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || exit 0
          git push
